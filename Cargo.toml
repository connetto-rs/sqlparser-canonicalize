[package]
name = "sqlparser-canonicalize"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Luca Cappelletti"]
license = "MIT"
description = "Canonical text and stable hashes for sqlparser ASTs"
repository = "https://github.com/connetto-rs/sqlparser-canonicalize"
documentation = "https://docs.rs/sqlparser-canonicalize"
keywords = ["sql", "canonicalization", "parser", "hash", "no-std"]
categories = ["database", "parser-implementations", "no-std"]

[features]
default = ["std"]
# Lets the SQL parser and the renderer grow their stacks on demand, so deeply nested input is
# refused instead of aborting the process. Turning this off keeps the crate `no_std` and gives
# up that guarantee.
std = ["sqlparser/recursive-protection", "dep:recursive"]

[dependencies]
recursive = { version = "0.1.1", optional = true }
seahash = { version = "4.1", default-features = false }
# Follows apache main until a sqlparser release carries `Expr::In` with its `global` field.
sqlparser = { git = "https://github.com/apache/datafusion-sqlparser-rs", branch = "main", default-features = false }
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"

[[bench]]
name = "canonicalize"
harness = false
